<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자유낙하 운동 물리 시뮬레이션</title><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#09090b;color:#eee;font:14px system-ui,"Malgun Gothic",sans-serif}h1{font-size:clamp(18px,4vw,24px);margin:0}header{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin:6px 0 14px}.btn,button{border:0;border-radius:8px;padding:9px;background:#2563eb;color:white;font-weight:700;cursor:pointer}.gamebtn{background:#6d28d9;border:1px solid #a78bfa}#game{display:none;max-width:700px;margin:auto;background:#18181b;border:1px solid #333;border-radius:12px;padding:10px}#game.active{display:block}.ghead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#facc15;font-weight:bold;margin-bottom:8px}.wrap{position:relative;max-width:600px;margin:auto}canvas{display:block;width:100%;height:auto;background:#101827;border-radius:8px}#gc{aspect-ratio:600/650;touch-action:none}.overlay{display:none;position:absolute;inset:0;background:#05080ddd;align-items:center;justify-content:center;text-align:center}.overlay.show{display:flex}.overbox{background:#222;border:1px solid #555;border-radius:14px;padding:20px}.overbox h2{color:#fb7185;margin:0 0 8px}.overbox strong{font-size:25px;color:#facc15}.controls{display:flex;gap:10px;margin:10px auto;max-width:600px}.controls button{flex:1;background:#333;padding:14px;font-size:18px;touch-action:none}#main{max-width:1100px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}.panel{background:#18181b;border:1px solid #333;border-radius:12px;padding:10px}.side{display:grid;gap:10px;align-content:start}.presets{display:grid;grid-template-columns:1fr 1fr;gap:5px}.preset{background:#333;padding:7px;font-size:12px}.preset.active{background:#075985}.ctl{margin:8px 0}.ctl label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}input{width:100%;accent-color:#38bdf8}.actions{display:flex;gap:7px}.actions button{flex:1}.secondary{background:#444}.small{font-size:11px;color:#aaa;line-height:1.5}.dash,.graphs{max-width:1100px;margin:12px auto;display:grid;gap:8px}.dash{grid-template-columns:repeat(4,1fr)}.tile{background:#18181b;border:1px solid #333;border-radius:9px;padding:9px}.tile small{display:block;color:#aaa}.tile b{font-size:15px}.graphs{grid-template-columns:repeat(3,1fr)}.graph{background:#18181b;border:1px solid #333;border-radius:10px;padding:8px}.graph h3{font-size:13px;margin:0 0 6px}.graph canvas{height:180px;background:#101018}.foot{text-align:center;color:#888;font-size:10px}@media(max-width:760px){#main{grid-template-columns:1fr}.dash{grid-template-columns:1fr 1fr}.graphs{grid-template-columns:1fr}}
</style></head><body><header><h1>자유낙하 운동 물리 시뮬레이션</h1><button class="gamebtn" id="open">🎮 자유낙하 미니 게임</button></header><p class="small" style="text-align:center">중력 · 공기 저항 · 탄성 충돌을 관찰하세요</p>
<section id="game"><div class="ghead"><span>🎮 미니 게임</span><span>시간 <span id="gt">00:00.00</span></span><span>최고 <span id="best">0.00</span>s</span></div><div class="wrap"><canvas id="gc" width="600" height="650"></canvas><div class="overlay" id="ov"><div class="overbox"><h2>게임 오버!</h2><p>생존 시간</p><strong id="score">0.00초</strong><p id="record"></p><div class="actions"><button id="again">다시하기</button><button class="secondary" id="exit">돌아가기</button></div></div></div></div><div class="controls"><button id="left">◀ 왼쪽</button><button id="right">오른쪽 ▶</button></div><p class="small" style="text-align:center">PC: ← → / 모바일: 버튼을 누르는 동안 이동 · 공의 높이는 고정</p></section>
<main id="main"><section class="panel"><canvas id="sim" width="650" height="540"></canvas></section><aside class="panel side"><b>행성 프리셋</b><div class="presets" id="presets"><button class="preset" data-name="mercury" data-g="3.7" data-d="0">수성</button><button class="preset" data-name="venus" data-g="8.87" data-d=".08">금성</button><button class="preset active" data-name="earth" data-g="9.8" data-d=".015">지구</button><button class="preset" data-name="moon" data-g="1.62" data-d="0">달</button><button class="preset" data-name="mars" data-g="3.71" data-d=".02">화성</button><button class="preset" data-name="jupiter" data-g="24.79" data-d=".03">목성</button><button class="preset" data-name="saturn" data-g="10.44" data-d=".025">토성</button><button class="preset" data-name="uranus" data-g="8.69" data-d=".02">천왕성</button><button class="preset" data-name="neptune" data-g="11.15" data-d=".022">해왕성</button><button class="preset" data-name="blackhole" data-g="100" data-d="0">블랙홀</button></div>
<div class="ctl"><label>높이 <output id="ho">300m</output></label><input id="h" type="range" min="10" max="500" step="5" value="300"></div><div class="ctl"><label>중력 <output id="go">9.80</output> m/s²</label><input id="g" type="range" min="0" max="100" step=".1" value="9.8"></div><div class="ctl"><label>공기 저항 <output id="do">0.015</output></label><input id="d" type="range" min="0" max=".1" step=".001" value=".015"></div><div class="ctl"><label>반발 계수 <output id="bo">0.70</output></label><input id="b" type="range" min="0" max=".95" step=".05" value=".7"></div><div class="ctl"><label>배속 <output id="so">1×</output></label><input id="s" type="range" min=".25" max="3" step=".25" value="1"></div><div class="actions"><button id="reset">다시 떨어뜨리기</button><button id="pause" class="secondary">일시정지</button></div><p class="small">캔버스를 누르면 공의 X좌표와 높이를 지정할 수 있어요. 공기저항은 속도 제곱에 비례하는 단순 모델입니다.</p></aside></main>
<section class="dash"><div class="tile"><small>상태</small><b id="status">낙하 중</b></div><div class="tile"><small>속력</small><b id="vout">0 m/s</b></div><div class="tile"><small>높이</small><b id="yout">300 m</b></div><div class="tile"><small>저항력 (1kg)</small><b id="fout">0 N</b></div></section><section class="graphs"><div class="graph"><h3>시간–높이</h3><canvas id="gh" width="520" height="210"></canvas></div><div class="graph"><h3>시간–속도</h3><canvas id="gv" width="520" height="210"></canvas></div><div class="graph"><h3>시간–가속도</h3><canvas id="ga" width="520" height="210"></canvas></div></section><p class="foot">교육용 간단 모델</p>
<script>(()=>{const $=id=>id[0]==='.'?document.querySelector(id):document.getElementById(id),sim=$('sim'),c=sim.getContext('2d'),W=650,H=540,ground=495,scale=.9,clamp=(x,a,z)=>Math.max(a,Math.min(z,x));let st={h:300,y:300,x:325,g:9.8,d:.015,b:.7,s:1,v:0,t:0,paused:false,planet:'earth'},trail=[],data=[];const py=y=>ground-clamp(y,0,500)*scale;function reset(){st.y=st.h;st.v=st.t=0;st.paused=false;trail=[];data=[{t:0,h:st.h,v:0,a:st.g}];$('pause').textContent='일시정지'}function sync(){ $('ho').value; $('ho').textContent=st.h+'m';$('go').textContent=st.g.toFixed(2);$('do').textContent=st.d.toFixed(3);$('bo').textContent=st.b.toFixed(2);$('so').textContent=st.s+'×'}
[['h','h'],['g','g'],['d','d'],['b','b'],['s','s']].forEach(([id,k])=>$(id).oninput=()=>{st[k]=+$(id).value;sync();if(k==='h')reset()});$('presets').onclick=e=>{let q=e.target.closest('button');if(!q)return;document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));q.classList.add('active');st.g=+q.dataset.g;st.d=+q.dataset.d;st.planet=q.dataset.name;$('g').value=st.g;$('d').value=st.d;sync();reset()};$('reset').onclick=reset;$('pause').onclick=()=>{st.paused=!st.paused;$('pause').textContent=st.paused?'재개':'일시정지'};sim.onpointerdown=e=>{let r=sim.getBoundingClientRect();st.x=clamp((e.clientX-r.left)*W/r.width,20,W-20);st.h=Math.round(clamp((ground-(e.clientY-r.top)*H/r.height)/scale,10,500)/5)*5;$('h').value=st.h;sync();reset()};function step(dt){if(st.paused)return;let a=st.g-st.d*st.v*Math.abs(st.v);st.v+=a*dt;st.y-=st.v*dt;st.t+=dt;if(st.y<=0){st.y=0;if(st.planet==='blackhole'){st.v=0;st.paused=true}else{let nv=Math.abs(st.v)*st.b;if(nv<.15){st.v=0;st.paused=true}else st.v=-nv}}data.push({t:st.t,h:st.y,v:st.v,a});if(data.length>1500)data.shift();trail.push([st.x,py(st.y)]);if(trail.length>160)trail.shift()}
function draw(){c.clearRect(0,0,W,H);let gr=c.createLinearGradient(0,0,0,ground);gr.addColorStop(0,'#0c1425');gr.addColorStop(1,'#15334b');c.fillStyle=gr;c.fillRect(0,0,W,ground);for(let m=0;m<=500;m+=50){let yy=py(m);c.strokeStyle='#ffffff18';c.beginPath();c.moveTo(0,yy);c.lineTo(W,yy);c.stroke();c.fillStyle='#9ca3af';c.font='11px sans-serif';c.fillText(m+'m',8,yy-3)}c.fillStyle='#334155';c.fillRect(0,ground,W,H-ground);c.strokeStyle='#7dd3fc';c.beginPath();trail.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.stroke();c.fillStyle='#38bdf8';c.shadowColor='#38bdf8';c.shadowBlur=14;c.beginPath();c.arc(st.x,py(st.y),17,0,Math.PI*2);c.fill();c.shadowBlur=0;$('status').textContent=st.paused?'정지':'낙하 중';$('vout').textContent=Math.abs(st.v).toFixed(2)+' m/s';$('yout').textContent=st.y.toFixed(1)+' m';$('fout').textContent=(st.d*st.v*st.v).toFixed(2)+' N'}
function graph(can,key,col){let q=can.getContext('2d'),w=can.width,h=can.height,p={l:42,r:8,t:10,b:24};q.clearRect(0,0,w,h);q.fillStyle='#101018';q.fillRect(0,0,w,h);if(!data.length)return;let xmax=Math.max(1,data.at(-1).t),vals=data.map(x=>x[key]),min=Math.min(0,...vals),max=Math.max(1,...vals);if(key==='h'){min=0;max=Math.max(10,st.h)}if(key==='a'){let z=Math.max(1,Math.abs(min),Math.abs(max));min=-z;max=z}if(max===min)max=min+1;let X=t=>p.l+t/xmax*(w-p.l-p.r),Y=v=>h-p.b-(v-min)/(max-min)*(h-p.t-p.b);q.strokeStyle='#ffffff18';q.fillStyle='#aaa';q.font='10px sans-serif';for(let i=0;i<=4;i++){let x=p.l+i*(w-p.l-p.r)/4,y=p.t+i*(h-p.t-p.b)/4;q.beginPath();q.moveTo(x,p.t);q.lineTo(x,h-p.b);q.moveTo(p.l,y);q.lineTo(w-p.r,y);q.stroke();q.fillText((xmax*i/4).toFixed(1),x-8,h-5)}q.strokeStyle=col;q.lineWidth=2;q.beginPath();data.forEach((z,i)=>i?q.lineTo(X(z.t),Y(z[key])):q.moveTo(X(z.t),Y(z[key])));q.stroke()}function frame(){step(1/60*st.s);draw();graph($('gh'),'h','#38bdf8');graph($('gv'),'v','#f472b6');graph($('ga'),'a','#facc15');requestAnimationFrame(frame)}sync();reset();frame();
// game
const gc=$('gc'),z=gc.getContext('2d'),GW=600,GH=650,player={x:300,y:525,r:16,speed:390};let game={run:false,t:0,last:0,move:0,spawn:.5,obs:[],best:+localStorage.ffBest||0};$('best').textContent=game.best.toFixed(2);function start(){game.run=true;game.t=0;game.last=0;game.spawn=.5;game.obs=[];player.x=300;$('ov').classList.remove('show')}function show(){ $('game').classList.add('active');$('main').style.display=$('.dash').style.display=$('.graphs').style.display=$('.foot').style.display='none';start()}function hide(){game.run=false;$('game').classList.remove('active');$('main').style.display=$('.dash').style.display=$('.graphs').style.display=$('.foot').style.display=''}function fmt(t){return Math.floor(t/60).toString().padStart(2,'0')+':'+Math.floor(t%60).toString().padStart(2,'0')+'.'+Math.floor(t%1*100).toString().padStart(2,'0')}function finish(){game.run=false;$('score').textContent=fmt(game.t);if(game.t>game.best){game.best=game.t;localStorage.ffBest=game.best.toFixed(2);$('best').textContent=game.best.toFixed(2);$('record').textContent='최고 기록 갱신!'}else $('record').textContent='최고 기록: '+game.best.toFixed(2)+'초';$('ov').classList.add('show')}function spawn(){let types=['rect','circle','tri','bar'],type=types[Math.random()*4|0],w=type==='bar'?120:type==='circle'?38:35+Math.random()*35,h=type==='bar'?25:type==='circle'?38:35+Math.random()*35;game.obs.push({x:15+Math.random()*(GW-w-30),y:-h,w,h,type})}function hit(o){let x=clamp(player.x,o.x,o.x+o.w),y=clamp(player.y,o.y,o.y+o.h);return (x-player.x)**2+(y-player.y)**2<player.r**2}function gameDraw(){z.clearRect(0,0,GW,GH);z.fillStyle='#0b1423';z.fillRect(0,0,GW,GH);z.strokeStyle='#ffffff12';for(let x=0;x<GW;x+=50){z.beginPath();z.moveTo(x,0);z.lineTo(x,GH);z.stroke()}for(let y=0;y<GH;y+=50){z.beginPath();z.moveTo(0,y);z.lineTo(GW,y);z.stroke()}game.obs.forEach(o=>{z.fillStyle='#fb7185';z.strokeStyle='#fecdd3';z.lineWidth=2;z.beginPath();if(o.type==='circle')z.arc(o.x+o.w/2,o.y+o.h/2,o.w/2,0,Math.PI*2);else if(o.type==='tri'){z.moveTo(o.x+o.w/2,o.y);z.lineTo(o.x+o.w,o.y+o.h);z.lineTo(o.x,o.y+o.h);z.closePath()}else z.roundRect(o.x,o.y,o.w,o.h,7);z.fill();z.stroke()});z.fillStyle='#38bdf8';z.shadowColor='#38bdf8';z.shadowBlur=15;z.beginPath();z.arc(player.x,player.y,player.r,0,Math.PI*2);z.fill();z.shadowBlur=0}function gf(now){if(game.run){if(!game.last)game.last=now;let dt=Math.min((now-game.last)/1000,.04);game.last=now;game.t+=dt;let speed=210+Math.min(game.t/25,1)*440,rate=Math.max(.24,.85-game.t/75);game.spawn-=dt;if(game.spawn<=0){let count=1+Math.min(2,Math.floor(game.t/25));for(let i=0;i<count;i++)spawn();game.spawn=rate*(.75+Math.random()*.5)}player.x=clamp(player.x+game.move*player.speed*dt,player.r,GW-player.r);game.obs.forEach(o=>o.y+=speed*dt);game.obs=game.obs.filter(o=>o.y<GH+70);if(game.obs.some(hit))finish();$('gt').textContent=fmt(game.t)}gameDraw();requestAnimationFrame(gf)}$('open').onclick=show;$('again').onclick=start;$('exit').onclick=hide;[['left',-1],['right',1]].forEach(([id,v])=>{let b=$(id);b.onpointerdown=e=>{e.preventDefault();game.move=v;b.setPointerCapture(e.pointerId)};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{if(game.move===v)game.move=0}))});window.onkeydown=e=>{if(!$('game').classList.contains('active'))return;if(e.key==='ArrowLeft')game.move=-1;if(e.key==='ArrowRight')game.move=1};window.onkeyup=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')game.move=0};requestAnimationFrame(gf)})();</script></body></html>
